<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="Segoe UI,system-ui,sans-serif">
<defs>
  <style>
    .node{fill:#0e1520;stroke:#1e2840;stroke-width:1.5;rx:10;ry:10}
    .node-done{fill:#052e1a;stroke:#00d68f;stroke-width:1.5;rx:10;ry:10}
    .node-active{fill:#0c2028;stroke:#22d3ee;stroke-width:1.5;rx:10;ry:10}
    .node-wait{fill:#0e1520;stroke:#2a3a5c;stroke-width:1;rx:10;ry:10;stroke-dasharray:5 3}
    .text{fill:#dfe7f3;font-size:13px;font-weight:600;text-anchor:middle}
    .text-sm{fill:#7b8ba8;font-size:10px;text-anchor:middle}
    .text-done{fill:#00d68f;font-size:13px;font-weight:600;text-anchor:middle}
    .arrow{stroke:#3b4f7e;stroke-width:1.5;fill:none;marker-end:url(#arrowhead)}
    .arrow-done{stroke:#00d68f;stroke-width:1.5;fill:none;marker-end:url(#arrow-green)}
    .lbl{fill:#4a5a78;font-size:9px;text-anchor:middle}
    .phase-lbl{fill:#22d3ee;font-size:11px;font-weight:700;text-anchor:start;letter-spacing:1px}
  </style>
  <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#3b4f7e"/>
  </marker>
  <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#00d68f"/>
  </marker>
</defs>
