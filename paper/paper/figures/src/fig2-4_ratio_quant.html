<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>图 2-4 配对频率比量化示意（10-27 竞标 D 版转正，管线同图 2-3）</title>
<!-- 内容锚点：正文 02 第 75 行（2.2.2(3)）。红线：示意不标实测值（N_A/N_B 符号化）、
     图内零注释、字≥7pt、色=§3 调色板族（环A=c1/环B=c2 直标承担身份）、无线段。
     再生成（Edge 无头截图，输出到 ../）：
     "/c/Program Files (x86)/Microsoft/Edge/Application/msedge.exe" --headless=new \
       --disable-gpu --hide-scrollbars --force-device-scale-factor=2 \
       --window-size=1600,620 --default-background-color=FFFFFFFF \
       --screenshot="../fig2-4_ratio_quant.png" \
       "file:///C:/Users/<teammate>/Desktop/puf-drone-auth/paper/figures/src/fig2-4_ratio_quant.html"
-->
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1600px; height:620px; background:#fff;
              font-family:"Segoe UI","Microsoft YaHei",sans-serif;
              color:#0b0b0b; overflow:hidden; }
  #cv { position:relative; width:1600px; height:620px; }
  .wave-label { position:absolute; font-size:25px; text-align:right;
                width:120px; transform:translateY(-50%); }
  .cnt { position:absolute; font-size:24px; transform:translateY(-50%); }
  .cnt i { font-family:Georgia,"Times New Roman",serif; font-size:22px; }
  .cnt sub { font-size:15px; }
  .win-label { position:absolute; font-size:25px; transform:translate(-50%,-50%); }
  .chip { position:absolute; height:58px; border:1.6px solid #0b0b0b; border-radius:9px;
          background:#fff; display:flex; align-items:center; justify-content:center;
          font-size:25px; }
  .chip i { font-family:Georgia,"Times New Roman",serif; font-size:23px; }
  .chip sub { font-size:15px; }
  #svg { position:absolute; inset:0; z-index:1; }
  .card { position:absolute; z-index:2; }
</style>
</head>
<body>
<div id="cv">
  <svg id="svg" width="1600" height="620" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7"
              markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="#0b0b0b"/>
      </marker>
    </defs>
    <!-- 测量窗带 + 边界（方波/计数点/流程箭头由脚本续画） -->
    <rect x="560" y="32" width="496" height="480" fill="#f0efec"/>
    <line x1="560" y1="32" x2="560" y2="512" stroke="#898781" stroke-width="1.2" stroke-dasharray="7,6"/>
    <line x1="1056" y1="32" x2="1056" y2="512" stroke="#898781" stroke-width="1.2" stroke-dasharray="7,6"/>
  </svg>
  <div class="card win-label" style="left:808px; top:20px;">测量窗</div>
  <div class="card wave-label" style="left:76px; top:124px;">环 A</div>
  <div class="card wave-label" style="left:76px; top:324px;">环 B</div>
  <div class="card cnt" style="left:1408px; top:80px;">窗内计数 <i>N<sub>A</sub></i></div>
  <div class="card cnt" style="left:1408px; top:324px;">窗内计数 <i>N<sub>B</sub></i></div>
  <div class="card chip" style="left:304px; top:532px; width:198px;">同窗计数</div>
  <div class="card chip" style="left:574px; top:532px; width:318px;">频率比 <i>N<sub>A</sub>&hairsp;/&hairsp;N<sub>B</sub></i></div>
  <div class="card chip" style="left:964px; top:532px; width:208px;"><i>指纹位 b<sub>k</sub></i></div>
</div>
<script>
const C1 = "#2a78d6", C2 = "#eb6834", INK = "#0b0b0b";
const svg = document.getElementById("svg");
const NS = "http://www.w3.org/2000/svg";
const el = (t, a) => { const e = document.createElementNS(NS, t);
  for (const k in a) e.setAttribute(k, a[k]); svg.appendChild(e); return e; };

// 方波：每周期 = 竖直沿 → 高半段 → 竖直沿 → 低半段；返回窗内(560..1056)上升沿 x
function wave(x0, x1, period, yHi, yLo, color) {
  let p = `M ${x0} ${yLo}`, rising = [];
  let x = x0;
  while (x < x1) {
    rising.push(x);
    const half = Math.min(period / 2, x1 - x);
    p += ` L ${x} ${yHi} L ${x + half} ${yHi} L ${x + half} ${yLo}`;
    x += period;
    if (x < x1) p += ` L ${x} ${yLo}`;
  }
  p += ` L ${x1} ${yLo}`;
  el("path", { d: p, stroke: color, "stroke-width": 3, fill: "none",
               "stroke-linecap": "butt", "stroke-linejoin": "miter" });
  return rising.filter(r => 560 < r && r < 1056);
}

const rA = wave(224, 1376, 89.6, 80, 168, C1);     // 环 A：快
const rB = wave(224, 1376, 118.4, 324, 412, C2);   // 环 B：慢

// 窗内上升沿计数点（色心白环）
for (const r of rA) el("circle", { cx: r, cy: 80, r: 10, fill: C1,
  stroke: "#fff", "stroke-width": 2 });
for (const r of rB) el("circle", { cx: r, cy: 324, r: 10, fill: C2,
  stroke: "#fff", "stroke-width": 2 });

// 底部流程箭头（chips CSS 定位：304..502 / 574..892 / 964..1172）
const Y = 561;
el("line", { x1: 502, y1: Y, x2: 566, y2: Y, stroke: INK, "stroke-width": 2,
             "marker-end": "url(#ah)" });
el("line", { x1: 892, y1: Y, x2: 956, y2: Y, stroke: INK, "stroke-width": 2,
             "marker-end": "url(#ah)" });
</script>
</body>
</html>
