<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>图 2-9 PC 基站认证业务程序流程（HTML/SVG→Edge 截图，与图 2-8 同管线成对）</title>
<!-- 内容锚点：正文 02 第 127 行（一字不差）＋第 129 行图题。
     设计同图 2-8：纵向主链 8 节点 + 灰区回绕；语义色同图 2-6/2-7/2-8
     （起点灰/过程 slot1 蓝族浅调/认证完成 slot3 绿族浅调）；图内零注释。
     CSS 800×848（单栏 §5 规格）。节点中心 y = 56 + 104k（同 2-8 节距）。
     代码佐证：src/python/server/protocol.py on_access_request（重放窗先于取种子）、
     on_response（灰区追加 3 组再判）、_finish_pass（HSM 出 R₂ 随 RESULT 回发）。
     再生成（Edge 无头截图，输出到 ../）：
     "/c/Program Files (x86)/Microsoft/Edge/Application/msedge.exe" --headless=new \
       --disable-gpu --hide-scrollbars --force-device-scale-factor=2 \
       --window-size=800,848 --default-background-color=FFFFFFFF \
       --screenshot="../fig2-9_server_auth_flow.png" \
       "file:///C:/Users/<teammate>/Desktop/puf-drone-auth/paper/figures/src/fig2-9_server_auth_flow.html"
-->
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:800px; height:848px; background:#fff;
              font-family:"Segoe UI","Microsoft YaHei",sans-serif;
              color:#0b0b0b; overflow:hidden; }
  #cv { position:relative; width:800px; height:848px; }
  #svg { position:absolute; inset:0; z-index:1; }
  .nd { position:absolute; z-index:2; transform:translate(-50%,-50%);
        display:flex; align-items:center; justify-content:center;
        border:2px solid #0b0b0b; font-size:22px; }
  .box { border-radius:9px; height:72px; }
  .std { border-radius:40px; height:56px; }
  .lb  { position:absolute; z-index:2; transform:translate(-50%,-50%);
        font-size:21px; white-space:nowrap; }
  sub  { font-size:72%; line-height:0; vertical-align:-0.18em; }
</style>
</head>
<body>
<div id="cv">
  <svg id="svg" width="800" height="848" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6"
              markerHeight="6" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="#0b0b0b"/>
      </marker>
    </defs>
    <!-- 纵向主链箭头（上一节点底 → 下一节点顶前 8px；中心 y=56/160/264/368/472/576/680/784） -->
    <line x1="400" y1="84"  x2="400" y2="116" stroke="#0b0b0b" stroke-width="2.2" marker-end="url(#ah)"/>
    <line x1="400" y1="196" x2="400" y2="220" stroke="#0b0b0b" stroke-width="2.2" marker-end="url(#ah)"/>
    <line x1="400" y1="300" x2="400" y2="324" stroke="#0b0b0b" stroke-width="2.2" marker-end="url(#ah)"/>
    <line x1="400" y1="404" x2="400" y2="428" stroke="#0b0b0b" stroke-width="2.2" marker-end="url(#ah)"/>
    <line x1="400" y1="508" x2="400" y2="532" stroke="#0b0b0b" stroke-width="2.2" marker-end="url(#ah)"/>
    <line x1="400" y1="612" x2="400" y2="636" stroke="#0b0b0b" stroke-width="2.2" marker-end="url(#ah)"/>
    <line x1="400" y1="716" x2="400" y2="748" stroke="#0b0b0b" stroke-width="2.2" marker-end="url(#ah)"/>
    <!-- 灰区回绕（双阈值判决右缘 → 右绕 → 从预认证挑战池取种子下发右缘） -->
    <polyline points="616,472 676,472 676,264 620,264" fill="none"
              stroke="#0b0b0b" stroke-width="2.2" marker-end="url(#ah)"/>
  </svg>
  <!-- 节点 -->
  <div class="nd std" style="left:400px; top:56px;  width:368px; background:#f0efec;">认证开始</div>
  <div class="nd box" style="left:400px; top:160px; width:432px; background:#cde2fb;">接收接入请求（校验重放窗）</div>
  <div class="nd box" style="left:400px; top:264px; width:432px; background:#cde2fb;">从预认证挑战池取种子下发</div>
  <div class="nd box" style="left:400px; top:368px; width:432px; background:#cde2fb;">比对指纹响应与模板的海明距离</div>
  <div class="nd box" style="left:400px; top:472px; width:432px; background:#cde2fb;">按双阈值判决</div>
  <div class="nd box" style="left:400px; top:576px; width:432px; background:#cde2fb;">经 HSM 生成 R<sub>2</sub>&nbsp;并回发结果</div>
  <div class="nd box" style="left:400px; top:680px; width:432px; background:#cde2fb;">接收终端确认</div>
  <div class="nd std" style="left:400px; top:784px; width:368px; background:#d3f0e4;">认证完成</div>
  <div class="lb" style="left:734px; top:368px;">灰区加测</div>
</div>
