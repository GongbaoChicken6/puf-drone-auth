<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #ffffff; }
  .canvas {
    width: 1900px; height: 312px;
    background: #ffffff;
    display: flex; align-items: center; justify-content: center;
    padding: 32px 30px;
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  .flow { display: flex; align-items: stretch; }
  .card {
    width: 330px;
    background: #ffffff;
    border: 1px solid #e1e0d9;
    border-radius: 12px;
    box-shadow: 0 3px 12px rgba(11,11,11,.08);
    overflow: hidden;
    display: flex; flex-direction: column;
  }
  .head {
    height: 80px;
    display: flex; align-items: center; gap: 14px;
    padding: 0 20px;
    color: #ffffff;
  }
  .badge {
    width: 40px; height: 40px; border-radius: 50%;
    background: #ffffff;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 700;
    flex: none;
  }
  .name { font-size: 21px; font-weight: 700; letter-spacing: .5px; flex: 1 1 auto; }
  .icon { flex: none; opacity: .95; }
  .body {
    flex: 1;
    padding: 18px 22px 20px;
    display: flex; flex-direction: column; justify-content: space-evenly;
    gap: 12px;
  }
  .item { display: flex; align-items: center; gap: 11px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .item span { font-size: 17px; color: #262626; line-height: 1.4; }
  /* 卡片间渐变流箭头：bar 渐变源色→目标色，三角头=目标色 */
  .arrow {
    width: 46px; flex: none;
    display: flex; align-items: center; justify-content: center;
  }
  .arrow .grp { display: flex; align-items: center; }
  .arrow .bar { width: 26px; height: 5px; border-radius: 3px; }
  .arrow .tip {
    width: 0; height: 0;
    border-top: 8px solid transparent;
    border-bottom: 8px solid transparent;
  }
</style>
</head>
<body>
<div class="canvas">
  <div class="flow">

    <!-- ① 方案论证 -->
    <div class="card">
      <div class="head" style="background:linear-gradient(135deg,#86b6ef 0%,#5598e7 100%)">
        <div class="badge" style="color:#0b2b57">1</div>
        <div class="name" style="color:#0b2b57">方案论证</div>
        <svg class="icon" width="30" height="30" viewBox="0 0 24 24" fill="none"
             stroke="#0b2b57" stroke-width="2" stroke-linecap="round">
          <circle cx="10.5" cy="10.5" r="6.5"/>
          <line x1="15.5" y1="15.5" x2="21" y2="21"/>
        </svg>
      </div>
      <div class="body">
        <div class="item"><i class="dot" style="background:#2a78d6"></i><span>信任根选型</span></div>
        <div class="item"><i class="dot" style="background:#2a78d6"></i><span>双板编队方案</span></div>
        <div class="item"><i class="dot" style="background:#2a78d6"></i><span>轻量协议栈设计</span></div>
      </div>
    </div>

    <div class="arrow"><div class="grp">
      <div class="bar" style="background:linear-gradient(90deg,#86b6ef,#5598e7)"></div>
      <div class="tip" style="border-left:12px solid #5598e7"></div>
    </div></div>

    <!-- ② 指纹机理验证 -->
    <div class="card">
      <div class="head" style="background:linear-gradient(135deg,#5598e7 0%,#2a78d6 100%)">
        <div class="badge" style="color:#0b2b57">2</div>
        <div class="name" style="color:#0b2b57">指纹机理验证</div>
        <svg class="icon" width="30" height="30" viewBox="0 0 24 24" fill="none"
             stroke="#0b2b57" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="1,13 4,13 6.5,5 9.5,19 12,9 14.5,15 17,13 23,13"/>
        </svg>
      </div>
      <div class="body">
        <div class="item"><i class="dot" style="background:#2a78d6"></i><span>16 环 XOR RO 阵列</span></div>
        <div class="item"><i class="dot" style="background:#2a78d6"></i><span>配对频率比量化</span></div>
        <div class="item"><i class="dot" style="background:#2a78d6"></i><span>指纹有效熵评估</span></div>
      </div>
    </div>

    <div class="arrow"><div class="grp">
      <div class="bar" style="background:linear-gradient(90deg,#5598e7,#2a78d6)"></div>
      <div class="tip" style="border-left:12px solid #2a78d6"></div>
    </div></div>

    <!-- ③ 协议与密码核实现 -->
    <div class="card">
      <div class="head" style="background:linear-gradient(135deg,#2a78d6 0%,#1c5cab 100%)">
        <div class="badge" style="color:#1c5cab">3</div>
        <div class="name">协议与密码核实现</div>
        <svg class="icon" width="30" height="30" viewBox="0 0 24 24" fill="none"
             stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="10" width="16" height="11" rx="2"/>
          <path d="M8 10V7a4 4 0 0 1 8 0v3"/>
          <circle cx="12" cy="15.5" r="1.6" fill="#ffffff" stroke="none"/>
        </svg>
      </div>
      <div class="body">
        <div class="item"><i class="dot" style="background:#2a78d6"></i><span>HF-IDA 六帧双向认证</span></div>
        <div class="item"><i class="dot" style="background:#2a78d6"></i><span>Speck64/96 全硬件密码核</span></div>
        <div class="item"><i class="dot" style="background:#2a78d6"></i><span>MAVLink v2 帧封装</span></div>
      </div>
    </div>

    <div class="arrow"><div class="grp">
      <div class="bar" style="background:linear-gradient(90deg,#2a78d6,#1c5cab)"></div>
      <div class="tip" style="border-left:12px solid #1c5cab"></div>
    </div></div>

    <!-- ④ 安全加固与攻防实验 -->
    <div class="card">
      <div class="head" style="background:linear-gradient(135deg,#1c5cab 0%,#104281 100%)">
        <div class="badge" style="color:#104281">4</div>
        <div class="name">安全加固与攻防实验</div>
        <svg class="icon" width="30" height="30" viewBox="0 0 24 24" fill="none"
             stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2l8 3v6c0 5-3.5 9-8 11-4.5-2-8-6-8-11V5z"/>
          <polyline points="8.5,12 11,14.5 15.5,9.5"/>
        </svg>
      </div>
      <div class="body">
        <div class="item"><i class="dot" style="background:#2a78d6"></i><span>机器学习建模攻击</span></div>
        <div class="item"><i class="dot" style="background:#2a78d6"></i><span>CRP 排序重构攻击</span></div>
        <div class="item"><i class="dot" style="background:#2a78d6"></i><span>威胁驱动安全加固</span></div>
      </div>
    </div>

    <div class="arrow"><div class="grp">
      <div class="bar" style="background:linear-gradient(90deg,#1c5cab,#104281)"></div>
      <div class="tip" style="border-left:12px solid #104281"></div>
    </div></div>

    <!-- ⑤ 板级集成与系统联调 -->
    <div class="card">
      <div class="head" style="background:linear-gradient(135deg,#104281 0%,#0b2b57 100%)">
        <div class="badge" style="color:#0b2b57">5</div>
        <div class="name">板级集成与系统联调</div>
        <svg class="icon" width="30" height="30" viewBox="0 0 24 24" fill="none"
             stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="6" y="6" width="12" height="12" rx="2"/>
          <rect x="10" y="10" width="4" height="4" fill="#ffffff" stroke="none"/>
          <line x1="9" y1="6" x2="9" y2="3"/><line x1="15" y1="6" x2="15" y2="3"/>
          <line x1="9" y1="18" x2="9" y2="21"/><line x1="15" y1="18" x2="15" y2="21"/>
          <line x1="6" y1="9" x2="3" y2="9"/><line x1="6" y1="15" x2="3" y2="15"/>
          <line x1="18" y1="9" x2="21" y2="9"/><line x1="18" y1="15" x2="21" y2="15"/>
        </svg>
      </div>
      <div class="body">
        <div class="item"><i class="dot" style="background:#2a78d6"></i><span>ZC706 双板烧录集成</span></div>
        <div class="item"><i class="dot" style="background:#2a78d6"></i><span>Web 实时监控联调</span></div>
        <div class="item"><i class="dot" style="background:#2a78d6"></i><span>功能与性能测试</span></div>
      </div>
    </div>

  </div>
</div>
</body>
</html>
