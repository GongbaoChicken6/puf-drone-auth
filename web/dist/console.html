<script>(function(){var C={1:'#22c55e',2:'#ef4444',3:'#f97316',4:'#eab308',5:'#6b7280',6:'#3b82f6',7:'#8b5cf6'};var I={1:'✓',2:'✗',3:'↻',4:'±',5:'∅',6:'⟳',7:'⚠'};function applyStyles(){document.querySelectorAll('button').forEach(function(b){var t=(b.textContent||'').trim();for(var i=1;i<=7;i++){if(t.indexOf('S'+i)===0){b.style.borderLeft='4px solid '+C[i];if(!b.getAttribute('data-iconed')){b.setAttribute('data-iconed','1');var s=document.createElement('span');s.style.cssText='color:'+C[i]+';font-weight:900;margin-right:4px;';s.textContent=I[i]+' ';b.prepend(s);}break;}}});}setInterval(applyStyles,500);setTimeout(applyStyles,100);setTimeout(applyStyles,500);setTimeout(applyStyles,1000);setTimeout(applyStyles,2000);})();</script>
